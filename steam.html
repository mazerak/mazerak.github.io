<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mazerak</title>
    <link rel="icon" href="favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      /* style.css locks html/body to the window, so the area under the navbar scrolls instead */
      body {
        display: flex;
        flex-direction: column;
      }
      .background-wrapper {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        padding: 5vh 16px 32px;
        scrollbar-color: #333 #0f0f0f;
      }
      .steam-panel {
        width: 100%;
        max-width: 720px;
        margin-bottom: 16px;
      }
      .steam-card {
        padding: 1.5rem;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        background: #181818;
      }
      .steam-card h1 {
        font-size: 1.4rem;
        letter-spacing: 0.05em;
        color: #fff;
        margin-bottom: 0.5rem;
      }
      .steam-sub {
        color: #aaa;
        font-size: 0.9rem;
        margin-bottom: 1rem;
      }
      #names {
        min-height: 110px;
        resize: vertical;
        background: #111;
        border: 1px solid #333;
        color: #e0e0e0;
        border-radius: 4px;
      }
      #names:focus {
        border-color: #555;
        box-shadow: none;
      }
      #names::placeholder {
        color: #666;
      }
      #go {
        width: 100%;
        margin-top: 10px;
        padding: 0.5rem;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 4px;
        font-weight: 600;
      }
      #go:hover {
        background: #ddd;
      }
      #go:disabled {
        background: #555;
        color: #999;
      }
      #status {
        margin-top: 1rem;
        color: #aaa;
      }
      #status.is-error {
        color: #e05555;
      }
      #notes {
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        background: #141414;
        border: 1px solid #2a2a2a;
        border-left: 3px solid #a08440;
        border-radius: 4px;
        color: #c9b27a;
        font-size: 0.85rem;
      }
      .game-list {
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        background: #181818;
        overflow: hidden;
      }
      .game-row {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 14px;
        align-items: center;
        padding: 10px 12px;
      }
      .game-row + .game-row {
        border-top: 1px solid #2a2a2a;
      }
      .game-row:hover {
        background: #1d1d1d;
      }
      .game-row img {
        width: 150px;
        height: 56px;
        object-fit: cover;
        border-radius: 4px;
        background: #222;
      }
      .game-row a {
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      .game-row a:hover {
        text-decoration: underline;
      }
      .game-hours {
        font-size: 13px;
        color: #888;
      }
      .game-tag {
        display: inline-block;
        margin: 4px 4px 0 0;
        padding: 1px 8px;
        background: #222;
        border: 1px solid #333;
        border-radius: 4px;
        color: #bbb;
        font-size: 12px;
      }
      .unknown-games {
        margin-top: 16px;
        padding: 1rem;
      }
      .unknown-games summary {
        color: #aaa;
        cursor: pointer;
      }
      .unknown-games .game-list {
        margin-top: 0.75rem;
      }
      @media (max-width: 520px) {
        .game-row {
          grid-template-columns: 1fr;
        }
        .game-row img {
          width: 100%;
          height: auto;
          aspect-ratio: 184 / 69;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark navbar-expand">
      <div class="container-fluid">
        <div class="navbar-nav me-auto navbar-spacing">
          <a class="navbar-brand" href="home.html">home</a>
          <a class="navbar-brand" href="daily.html">daily</a>
          <a class="navbar-brand" href="endless.html">endless</a>
          <a class="navbar-brand" href="globe.html">globe thing</a>
          <a class="navbar-brand" href="steam.html">steam</a>
        </div>
      </div>
    </nav>

    <div class="background-wrapper">
      <div class="steam-panel steam-card">
        <h1>what can we play together</h1>
        <p class="steam-sub">
          steam usernames, profile links, or 17-digit ids, one person per line.
          if someone has two accounts, put both on their line with "or" between them
        </p>
        <textarea
          id="names"
          class="form-control"
          placeholder="yourname&#10;yourfriend or yourfriend_alt"
        ></textarea>
        <button id="go" class="btn">find shared games</button>
        <p id="status" hidden></p>
        <div id="notes" hidden></div>
      </div>

      <div id="results" class="steam-panel"></div>
    </div>

    <script>
      const API = "https://api.mazerak.com";
      const token = localStorage.getItem("token");
      if (!token) window.location.href = "index.html";

      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      try { $("names").value = localStorage.getItem("steam-names") || ""; } catch {}

      function setStatus(text, isError) {
        const s = $("status");
        s.hidden = false;
        s.textContent = text;
        s.classList.toggle("is-error", !!isError);
      }

      async function api(path, body) {
        const r = await fetch(API + path, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: token },
          body: JSON.stringify(body),
        });
        if (r.status === 401) {
          localStorage.removeItem("token");
          window.location.href = "index.html";
          throw new Error("logged out");
        }
        const d = await r.json().catch(() => ({ error: `server error (${r.status})` }));
        if (!r.ok) {
          const err = new Error(d.error || `server error (${r.status})`);
          err.status = r.status; // 403 = private library
          throw err;
        }
        return d;
      }

      // Ask the server about shared games in batches so we can show progress
      async function checkGames(ids, onProgress) {
        const info = {};
        onProgress(0);
        for (let i = 0; i < ids.length; i += 20) {
          const { apps } = await api("/steam/apps", { ids: ids.slice(i, i + 20) });
          Object.assign(info, apps);
          onProgress(Math.min(i + 20, ids.length));
        }
        return info;
      }

      // One person = one or more accounts. Their libraries are merged and hours added up.
      // Private accounts are left out and reported in notes instead of stopping everything.
      async function loadPerson(accounts) {
        const results = await Promise.all(
          accounts.map((a) =>
            api("/steam/owned", { user: a }).then(
              (data) => ({ data }),
              (e) => {
                if (e.status === 403) return { privateMsg: e.message };
                throw e;
              }
            )
          )
        );
        const found = results.filter((r) => r.data).map((r) => r.data);
        const notes = results.filter((r) => r.privateMsg).map((r) => "skipped: " + r.privateMsg);
        if (!found.length) return { notes };

        const byId = {};
        for (const acc of found) {
          for (const g of acc.games) {
            if (byId[g.appid]) byId[g.appid].hours = Math.round((byId[g.appid].hours + g.hours) * 10) / 10;
            else byId[g.appid] = { ...g };
          }
        }
        return {
          person: { name: found.map((a) => a.name).join(" / "), games: Object.values(byId), byId },
          notes,
        };
      }

      function showNotes(notes) {
        $("notes").hidden = !notes.length;
        $("notes").innerHTML = notes.map((n) => `<div>${esc(n)}</div>`).join("");
      }

      function row(g, people) {
        const hours = people.map((p) => `${esc(p.name)}: ${p.byId[g.appid].hours}h`).join(", ");
        const tags = (g.tags || []).map((t) => `<span class="game-tag">${esc(t)}</span>`).join("");
        return `<div class="game-row">
          <img loading="lazy" alt="" src="https://cdn.cloudflare.steamstatic.com/steam/apps/${g.appid}/capsule_184x69.jpg" onerror="this.style.visibility='hidden'">
          <div>
            <a href="https://store.steampowered.com/app/${g.appid}" target="_blank" rel="noopener">${esc(g.name)}</a>
            <div class="game-hours">${hours}</div>
            <div>${tags}</div>
          </div>
        </div>`;
      }

      $("go").onclick = async () => {
        const lines = $("names").value.split(/\n|,/).map((s) => s.trim()).filter(Boolean);
        if (lines.length < 2) return setStatus("enter at least two people", true);
        try { localStorage.setItem("steam-names", lines.join("\n")); } catch {}
        const groups = lines.map((l) => l.split(/\s*\|\s*|\s+or\s+/i).filter(Boolean));

        $("go").disabled = true;
        $("results").innerHTML = "";
        showNotes([]);
        setStatus("grabbing libraries…");

        try {
          const loaded = await Promise.all(groups.map(loadPerson));
          showNotes(loaded.flatMap((l) => l.notes));
          const people = loaded.filter((l) => l.person).map((l) => l.person);
          if (people.length < 2) throw new Error("need at least two people with public libraries to compare");

          const shared = people[0].games.filter((g) => people.every((p) => p.byId[g.appid]));
          const ids = shared.map((g) => g.appid);
          const info = await checkGames(ids, (n) =>
            setStatus(`checking which of your ${ids.length} shared games are multiplayer… ${n}/${ids.length}`)
          );

          const total = (g) => people.reduce((sum, p) => sum + p.byId[g.appid].hours, 0);
          const mp = shared
            .filter((g) => info[g.appid]?.mp === true)
            .map((g) => ({ ...g, tags: info[g.appid].tags }))
            .sort((a, b) => total(b) - total(a));
          const unknown = shared
            .filter((g) => !info[g.appid] || info[g.appid].mp === null)
            .sort((a, b) => a.name.localeCompare(b.name));

          setStatus(`${people.map((p) => p.name).join(", ")} share ${shared.length} game${shared.length === 1 ? "" : "s"}, ${mp.length} of them multiplayer`);
          $("results").innerHTML =
            (mp.length ? `<div class="game-list">${mp.map((g) => row(g, people)).join("")}</div>` : "") +
            (unknown.length
              ? `<details class="steam-card unknown-games"><summary>${unknown.length} shared game${unknown.length === 1 ? "" : "s"} couldn't be checked (delisted, or steam was busy)</summary>
                 <div class="game-list">${unknown.map((g) => row(g, people)).join("")}</div></details>`
              : "");
        } catch (e) {
          if (e.message !== "logged out") setStatus(e.message, true);
        }
        $("go").disabled = false;
      };
    </script>
  </body>
</html>
