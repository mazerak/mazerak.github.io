<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mazerak</title>
    <link rel="icon" href="favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      .background-wrapper {
        flex-direction: column;
        align-items: center;
        padding: 32px 16px;
      }
      .steam-panel {
        width: 100%;
        max-width: 720px;
        margin-bottom: 16px;
      }
      .steam-panel textarea {
        min-height: 110px;
        resize: vertical;
      }
      .game-row {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 14px;
        align-items: center;
      }
      .game-row img {
        width: 150px;
        height: 56px;
        object-fit: cover;
        border-radius: 4px;
        background: #dee2e6;
      }
      .game-row a {
        color: inherit;
        font-weight: 600;
        text-decoration: none;
      }
      .game-row a:hover {
        text-decoration: underline;
      }
      .game-hours {
        font-size: 13px;
        color: #6c757d;
      }
      @media (max-width: 520px) {
        .game-row {
          grid-template-columns: 1fr;
        }
        .game-row img {
          width: 100%;
          height: auto;
          aspect-ratio: 184 / 69;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark navbar-expand">
      <div class="container-fluid">
        <div class="navbar-nav me-auto navbar-spacing">
          <a class="navbar-brand" href="home.html">home</a>
          <a class="navbar-brand" href="daily.html">daily</a>
          <a class="navbar-brand" href="endless.html">endless</a>
          <a class="navbar-brand" href="globe.html">globe thing</a>
          <a class="navbar-brand" href="steam.html">steam</a>
        </div>
      </div>
    </nav>

    <div class="background-wrapper">
      <div class="steam-panel bg-white text-dark rounded p-3">
        <h1 class="h4">what can we play together</h1>
        <p class="text-secondary mb-2">
          steam usernames, profile links, or 17-digit ids, one per line
        </p>
        <textarea
          id="names"
          class="form-control mb-2"
          placeholder="yourname&#10;https://steamcommunity.com/id/yourfriend"
        ></textarea>
        <button id="go" class="btn btn-dark w-100">find shared games</button>
        <p id="status" class="mt-3 mb-0 text-secondary" hidden></p>
      </div>

      <div id="results" class="steam-panel"></div>
    </div>

    <script>
      const API = "https://api.mazerak.com";
      const token = localStorage.getItem("token");
      if (!token) window.location.href = "index.html";

      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      try { $("names").value = localStorage.getItem("steam-names") || ""; } catch {}

      function setStatus(text, isError) {
        const s = $("status");
        s.hidden = false;
        s.textContent = text;
        s.className = "mt-3 mb-0 " + (isError ? "text-danger" : "text-secondary");
      }

      async function api(path, body) {
        const r = await fetch(API + path, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: token },
          body: JSON.stringify(body),
        });
        if (r.status === 401) {
          localStorage.removeItem("token");
          window.location.href = "index.html";
          throw new Error("logged out");
        }
        const d = await r.json().catch(() => ({ error: `server error (${r.status})` }));
        if (!r.ok) throw new Error(d.error || `server error (${r.status})`);
        return d;
      }

      // Ask the server about shared games in batches so we can show progress
      async function checkGames(ids, onProgress) {
        const info = {};
        onProgress(0);
        for (let i = 0; i < ids.length; i += 20) {
          const { apps } = await api("/steam/apps", { ids: ids.slice(i, i + 20) });
          Object.assign(info, apps);
          onProgress(Math.min(i + 20, ids.length));
        }
        return info;
      }

      function row(g, people) {
        const hours = people.map((p) => `${esc(p.name)}: ${p.byId[g.appid].hours}h`).join(", ");
        const tags = (g.tags || []).map((t) => `<span class="badge text-bg-light border me-1">${esc(t)}</span>`).join("");
        return `<div class="list-group-item game-row">
          <img loading="lazy" alt="" src="https://cdn.cloudflare.steamstatic.com/steam/apps/${g.appid}/capsule_184x69.jpg" onerror="this.style.visibility='hidden'">
          <div>
            <a href="https://store.steampowered.com/app/${g.appid}" target="_blank" rel="noopener">${esc(g.name)}</a>
            <div class="game-hours">${hours}</div>
            <div>${tags}</div>
          </div>
        </div>`;
      }

      $("go").onclick = async () => {
        const names = $("names").value.split(/\n|,/).map((s) => s.trim()).filter(Boolean);
        if (names.length < 2) return setStatus("enter at least two people", true);
        try { localStorage.setItem("steam-names", names.join("\n")); } catch {}

        $("go").disabled = true;
        $("results").innerHTML = "";
        setStatus("grabbing libraries…");

        try {
          const people = await Promise.all(names.map((n) => api("/steam/owned", { user: n })));
          people.forEach((p) => (p.byId = Object.fromEntries(p.games.map((g) => [g.appid, g]))));

          const shared = people[0].games.filter((g) => people.every((p) => p.byId[g.appid]));
          const ids = shared.map((g) => g.appid);
          const info = await checkGames(ids, (n) =>
            setStatus(`checking which of your ${ids.length} shared games are multiplayer… ${n}/${ids.length}`)
          );

          const total = (g) => people.reduce((sum, p) => sum + p.byId[g.appid].hours, 0);
          const mp = shared
            .filter((g) => info[g.appid]?.mp === true)
            .map((g) => ({ ...g, tags: info[g.appid].tags }))
            .sort((a, b) => total(b) - total(a));
          const unknown = shared
            .filter((g) => !info[g.appid] || info[g.appid].mp === null)
            .sort((a, b) => a.name.localeCompare(b.name));

          setStatus(`${people.map((p) => p.name).join(", ")} share ${shared.length} games, ${mp.length} of them multiplayer`);
          $("results").innerHTML =
            (mp.length ? `<div class="list-group">${mp.map((g) => row(g, people)).join("")}</div>` : "") +
            (unknown.length
              ? `<details class="bg-white text-dark rounded p-3 mt-3"><summary>${unknown.length} shared games couldn't be checked (delisted, or steam was busy)</summary>
                 <div class="list-group mt-2">${unknown.map((g) => row(g, people)).join("")}</div></details>`
              : "");
        } catch (e) {
          if (e.message !== "logged out") setStatus(e.message, true);
        }
        $("go").disabled = false;
      };
    </script>
  </body>
</html>
